<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="pickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc933"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2e2e36" stroke-width="4"/>
  
  <!-- Glowing guitar pick -->
  <path d="M 120 125 C 190 75, 322 75, 392 125 C 430 230, 360 365, 256 425 C 152 365, 82 230, 120 125 Z" fill="url(#pickGrad)" filter="url(#glow)"/>
  
  <!-- Inner circular cut / soundhole -->
  <circle cx="256" cy="225" r="62" fill="#16161a"/>
  
  <!-- Musical note in amber -->
  <circle cx="240" cy="245" r="18" fill="#ffc933"/>
  <rect x="252" y="190" width="6" height="55" fill="#ffc933"/>
  <path d="M 258 190 Q 285 200, 290 220 Q 275 210, 258 205 Z" fill="#ffc933"/>
  
  <!-- Chord symbol mini badge -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0b0b0d" text-anchor="middle" letter-spacing="1">CHORD</text>
</svg>
