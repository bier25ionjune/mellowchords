<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="คลังคอร์ด">
<meta name="description" content="สมุดคอร์ดเพลงสำหรับนักดนตรีกลางคืน ค้นหา เล่นสด จัด Playlist เปลี่ยนคีย์ ออฟไลน์ 100%">

<title>🎸 คลังคอร์ดกลางคืน (mellowchords)</title>

<!-- PWA Manifest & Icons -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Google Fonts (Sarabun) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- App Stylesheet -->
<link rel="stylesheet" href="app.css">
</head>
<body data-view="home">

<!-- Compact Top App Bar -->
<header id="hdr">
  <div class="hdrTop">
    <div class="brand" id="brandHome" role="button" tabindex="0" aria-label="กลับหน้าหลัก">
      <img src="icon.svg" alt="mellowchords">
      <h1>คลังคอร์ดกลางคืน</h1>
    </div>
    <div class="row" style="gap:6px">
      <button id="pwaInstallHeaderBtn" class="small primary" hidden>📲 ติดตั้งแอป</button>
      <button id="acct" class="small">☁️ ซิงก์ / ตั้งค่า</button>
    </div>
  </div>
</header>

<!-- Floating Stage Mode Indicators -->
<div class="focusTopBar">
  <div id="wakeLockBadge" hidden>💡 จอเปิดค้าง</div>
  <button id="exitFocus" hidden>✕ ออกจากโหมดเวที</button>
</div>

<div class="app">
<!-- ==================== LEFT SIDEBAR / MOBILE TABS (HOME & PLAYLISTS) ==================== -->
<aside id="side">
  <!-- Unified Instant Search & Web Search Bar -->
  <form id="searchForm" class="searchBar" autocomplete="off">
    <div class="searchWrap">
      <span class="sIcon">🔍</span>
      <input id="q" type="search" enterkeyhint="search" placeholder="ค้นหาเพลงในคลัง หรือค้นจากเว็บ…" aria-label="ค้นหา">
      <button type="button" id="clearSearchBtn" class="clearBtn" hidden aria-label="ล้างคำค้น">✕</button>
    </div>
    <button class="primary small" type="submit" title="ค้นหาคอร์ดเพลงบน Google">🌐 ค้นเว็บ</button>
  </form>

  <!-- Quick 1-Tap Action Cards -->
  <div id="quickAddBar" class="quickActions">
    <button type="button" id="pasteBtn" class="quickCard accent">
      <span class="qIcon">📋</span>
      <span class="qText">
        <b>วางคอร์ด / ลิงก์</b>
        <small>ดึงจากคลิปบอร์ดทันที</small>
      </span>
    </button>
    <button type="button" id="addBtn" class="quickCard">
      <span class="qIcon">📸</span>
      <span class="qText">
        <b>เพิ่มเพลง / รูปคอร์ด</b>
        <small>พิมพ์เอง หรือสแกนภาพ</small>
      </span>
    </button>
  </div>

  <!-- Built-in Demo Songs Search Results -->
  <section id="resultsBox" class="block" hidden>
    <div class="secHeader">
      <h2>🎵 เพลงตัวอย่างในแอป</h2>
    </div>
    <div id="results" class="list"></div>
  </section>

  <!-- My Songbook Section -->
  <section id="librarySection" class="block">
    <div class="secHeader">
      <h2>📚 คลังเพลงของฉัน <span id="count" class="badge dim">0</span></h2>
      <div class="row" style="gap:4px">
        <button id="exportBtn" class="small ghost" title="สำรองข้อมูลไฟล์ JSON">⬇ สำรอง</button>
        <button id="importBtn" class="small ghost" title="นำเข้าไฟล์ JSON">⬆ นำเข้า</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="filterTabs" role="tablist">
      <button type="button" class="pillTab active" data-filter="all">ทั้งหมด</button>
      <button type="button" class="pillTab" data-filter="fav">⭐ รายการโปรด</button>
      <button type="button" class="pillTab" data-filter="recent">🕒 ล่าสุด</button>
    </div>

    <div id="songbook" class="list"></div>
  </section>

  <!-- Playlists Section -->
  <section id="plSection" class="block">
    <div class="secHeader">
      <h2>🎼 เซ็ตเพลง (Playlist) <span id="plCount" class="badge dim">0</span></h2>
      <button id="plNew" class="small primary">＋ สร้างเซ็ตใหม่</button>
    </div>
    <div id="plList" class="list"></div>
  </section>
</aside>

<!-- ==================== RIGHT PANE / MAIN CONTENT AREA ==================== -->
<section id="pane">
  <div id="placeholder">
    <b>🎸</b>
    <div>เลือกเพลงจากคลังเพลงทางซ้าย หรือกดปุ่ม <b>“วางคอร์ด / ลิงก์”</b> เพื่อเริ่มเล่นสด</div>
  </div>

  <!-- ==================== VIEW: SONG EDITOR & OCR ==================== -->
  <div id="editorView" hidden>
    <div class="songTopBar">
      <button class="backBtn topBack small" type="button">← กลับ</button>
      <h2 id="editorTitle">เพิ่มเพลง</h2>
      <div class="row" style="gap:6px">
        <button type="button" id="topSaveEditorBtn" class="primary small">💾 บันทึก</button>
      </div>
    </div>

    <form id="editorForm" class="card">
      <label for="fUrl" style="margin-top:0">🔗 ดึงคอร์ดอัตโนมัติจากลิงก์เว็บ (ไม่บังคับ)</label>
      <div class="row">
        <input id="fUrl" class="grow" type="url" placeholder="วางลิงก์ https://… (เช่น chordtabs, sanook, blog)" autocapitalize="none" autocorrect="off">
        <button type="button" id="fetchUrlBtn" class="primary">🌐 ดึงคอร์ด</button>
      </div>

      <div class="row" style="margin-top:10px">
        <div class="grow" style="min-width:180px">
          <label for="fTitle" style="margin-top:0">ชื่อเพลง *</label>
          <input id="fTitle" required placeholder="เช่น ค่ำคืนนี้">
        </div>
        <div class="grow" style="min-width:150px">
          <label for="fArtist" style="margin-top:0">ศิลปิน</label>
          <input id="fArtist" placeholder="เช่น Bodyslam">
        </div>
        <div style="width:105px">
          <label for="fKey" style="margin-top:0">คีย์เดิม</label>
          <input id="fKey" placeholder="อัตโนมัติ" autocapitalize="characters">
        </div>
      </div>

      <!-- Editor / Live Preview Toggle -->
      <div class="row between" style="margin-top:14px; margin-bottom:6px">
        <div class="editorTabs">
          <button type="button" id="tabEditBtn" class="pillTab active">✏️ แก้ไขข้อความ</button>
          <button type="button" id="tabPreviewBtn" class="pillTab">👁️ ดูตัวอย่างคอร์ด</button>
        </div>
        <div class="row" style="gap:6px">
          <button type="button" id="formatTextBtn" class="small secondary" title="จัดชื่อท่อน [Intro] [Chorus] อัตโนมัติ">✨ จัดท่อน</button>
          <button type="button" id="convertBracketBtn" class="small secondary" title="แปลงคอร์ดบรรทัดบนให้แทรกในเนื้อ [G] เพื่อไม่ให้เพี้ยนบนมือถือ">🔤 แปลงเป็น [คอร์ด]</button>
        </div>
      </div>

      <textarea id="fText" spellcheck="false" placeholder="วางเนื้อเพลงและคอร์ดได้ทุกรูปแบบ:&#10;&#10;1) คอร์ดอยู่บรรทัดบน เนื้ออยู่บรรทัดล่าง&#10;G        Em&#10;ค่ำคืนนี้ลมเย็น&#10;&#10;2) คอร์ดแทรกในเนื้อ [G]ค่ำคืนนี้ลม[Em]เย็น"></textarea>
      <div id="livePreviewBox" class="previewBox sheet" hidden></div>

      <label>🖼 ภาพคอร์ด / สกรีนช็อต (พร้อม AI สแกนเป็นข้อความ)</label>
      <div class="row">
        <label for="fImgs" class="small secondary" style="margin:0; cursor:pointer; display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--panel2)">
          📁 เลือกรูปภาพ
        </label>
        <input id="fImgs" type="file" accept="image/*" multiple hidden>
        <button type="button" id="pasteImgBtn" class="small">📋 วางรูป</button>
        <button type="button" id="ocrScanBtn" class="small primary">🔍 สแกนคอร์ดจากภาพ (OCR)</button>
      </div>
      <div id="thumbs" class="thumbs"></div>

      <div class="row" style="margin-top:18px">
        <button class="primary grow" type="submit">💾 บันทึกและเปิดดูเพลง</button>
        <button type="button" class="backBtn">ยกเลิก</button>
      </div>
    </form>
  </div>

  <!-- ==================== VIEW: SONG PERFORMER SHEET ==================== -->
  <div id="songView" hidden>
    <!-- Active Playlist Queue Bar (Shows when playing inside a Setlist) -->
    <div id="setlistNav" class="setlistNav meta" hidden>
      <button type="button" id="prevSongBtn" class="small">⏮ ก่อนหน้า</button>
      <div class="setlistInfo">
        <small id="setlistName">เซ็ตเพลง</small>
        <b id="setlistPos">เพลงที่ 1 / 1</b>
      </div>
      <button type="button" id="nextSongBtn" class="small primary">ถัดไป ⏭</button>
    </div>

    <!-- Clean Top Navigation & Action Bar -->
    <div class="songTopBar meta">
      <button class="backBtn topBack small" type="button">← กลับ</button>
      <div class="songTopActions">
        <span id="savedTag" class="badge green" hidden>บันทึกแล้ว ✔</span>
        <button id="saveBtn" class="primary small">💾 บันทึกเข้าคลัง</button>
        <button id="favBtn" class="small iconBtn" title="รายการโปรด" aria-label="รายการโปรด">☆</button>
        <button id="plBtn" class="small" title="เพิ่มเข้าเซ็ตเพลง">➕ เซ็ตเพลง</button>
        <button id="editBtn" class="small" title="แก้ไขเพลง">✏️ แก้ไข</button>
        <button id="deleteBtn" class="small danger iconBtn" hidden title="ลบเพลง" aria-label="ลบเพลง">🗑</button>
      </div>
    </div>

    <article class="card">
      <div class="songHeader">
        <div class="songTitleWrap">
          <h2 id="cTitle"></h2>
          <div id="cArtist" class="artist"></div>
        </div>
        <button id="focusBtn" class="primary small meta">🎭 โหมดเวทีเต็มจอ</button>
      </div>

      <!-- Compact Key, Capo Hint & Column Layout Toggle -->
      <div class="keyBar meta">
        <span class="keyPill">คีย์เดิม <b id="cKeyOrig">-</b></span>
        <span class="keyPill">เล่นคีย์ <b id="cKeyNow">-</b></span>
        <span id="capoHint" class="capoHint" hidden>🎸 ทดคีย์</span>
        <div class="viewToggles">
          <button type="button" id="colToggleBtn" class="small" title="สลับแสดงผล 1 หรือ 2 คอลัมน์">📄 1 คอลัมน์</button>
        </div>
      </div>

      <!-- Rendered Chord Sheet (Tap any chord to inspect guitar fingering) -->
      <div id="sheet" class="sheet"></div>
      <div id="gallery" class="gallery" hidden></div>
    </article>

    <!-- Single-Row Compact Performer Floating Dock -->
    <div class="dock" role="toolbar" aria-label="แผงควบคุมการเล่นสด">
      <div class="grp" id="tpGrp">
        <button id="downBtn" class="tp" aria-label="ลดคีย์ครึ่งเสียง">−</button>
        <div id="resetBtn" class="shiftBadge" title="แตะเพื่อรีเซ็ตคีย์เดิม" role="button" tabindex="0">
          <b id="dockKey">-</b>
          <small id="shiftLabel">คีย์เดิม</small>
        </div>
        <button id="upBtn" class="tp" aria-label="เพิ่มคีย์ครึ่งเสียง">+</button>
      </div>

      <div class="dockDivider"></div>

      <div class="grp">
        <button id="fontDown" aria-label="ลดขนาดตัวอักษร">A−</button>
        <button id="fontUp" aria-label="เพิ่มขนาดตัวอักษร">A+</button>
      </div>

      <div class="dockDivider"></div>

      <div class="grp">
        <button id="scrollBtn" class="primary">⏬ เลื่อน</button>
        <button id="speedBtn" title="ความเร็วการเลื่อนอัตโนมัติ">1x</button>
      </div>
    </div>
  </div>

  <!-- ==================== VIEW: PLAYLIST / SETLIST DETAILS ==================== -->
  <div id="plView" hidden>
    <div class="songTopBar">
      <button type="button" class="topBack small" id="plBack">← กลับ</button>
      <h2 id="plTitle" class="grow"></h2>
    </div>
    <div class="card">
      <div class="row" id="plBar" style="margin-bottom:12px"></div>
      <div id="plLink"></div>
      <div class="list" id="plSongs"></div>
    </div>
  </div>
</section>
</div>

<!-- ==================== NATIVE MOBILE BOTTOM NAVIGATION BAR ==================== -->
<nav id="bottomNav" aria-label="เมนูหลัก">
  <button type="button" class="navTab active" data-nav="home">
    <span class="nIcon">📚</span>
    <span>คลังเพลง</span>
  </button>
  <button type="button" class="navTab" data-nav="playlists">
    <span class="nIcon">🎼</span>
    <span>เซ็ตเพลง</span>
  </button>
  <button type="button" class="navTab" data-nav="editor">
    <span class="nIcon">➕</span>
    <span>เพิ่มเพลง</span>
  </button>
  <button type="button" class="navTab" data-nav="settings">
    <span class="nIcon">⚙️</span>
    <span>ตั้งค่า</span>
  </button>
</nav>

<!-- Image Lightbox Modal -->
<div id="lightbox" hidden>
  <div class="lbBar">
    <button id="lbZoom" class="small">🔍 ขยาย</button>
    <button id="lbClose" class="small primary">✕ ปิด</button>
  </div>
  <div id="lbBody" class="lbBody">
    <img id="lbImg" alt="">
  </div>
</div>

<!-- Toast Feedback -->
<div id="toast" class="toast" hidden></div>

<!-- Supabase SDK & App Logic -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
